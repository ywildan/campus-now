<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Karsa Campus">
  <!--
    Karsa Campus: huruf "Kc" digambar sebagai path (bukan teks),
    gaya stroke berujung membulat yang sama dengan Karsa Mobile & Karsa Business.
    Warna: oranye dan krem khas Karsa Mobile.
  -->
  <rect width="512" height="512" rx="112" fill="#CF6A12" />

  <g fill="none" stroke="#FDFBF7" stroke-linecap="round" stroke-linejoin="round">
    <!-- K: batang -->
    <path d="M137.6 171.2 V340.8" stroke-width="46.4" />
    <!-- K: lengan atas dan bawah -->
    <path d="M137.6 256 L240 171.2" stroke-width="43.2" />
    <path d="M137.6 256 L240 340.8" stroke-width="43.2" />
    <!-- c: busur terbuka di sisi kanan -->
    <path d="M361 211.8 A54 54 0 1 0 361 300.2" stroke-width="43.2" />
  </g>
</svg>
